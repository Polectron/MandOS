; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = core, blinker

; Shared settings inherited by every firmware
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = 
    mandos_common
    mandos_core

; Core: ESP32 Dev Module (classic ESP32, UART via USB-serial chip)
[env:core]
board = esp32dev
; WiFi + BLE firmware outgrows the default 1.3 MB app partition
board_build.partitions = huge_app.csv
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^2
build_src_filter = -<*> +<core/>
build_flags =
    -DMANDOS_CORE
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0

; Base for every peripheral: ESP32-C3 Super Mini (native USB CDC).
; Each device type is its own env under devices/<name>/.
[device_base]
board = esp32-c3-devkitm-1
build_flags =
    -DMANDOS_DEVICE
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    mandos_common
    mandos_device

[env:blinker]
extends = device_base
build_src_filter = -<*> +<devices/blinker/>
